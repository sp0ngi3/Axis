services:
  axis-api:
    image: axis-api:production
    build:
      context: .
      dockerfile: src/backend/Axis.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Axis: Data Source=/data/axis.db
      Backup__Directory: /backups
      Cors__AllowedOrigins__0: http://localhost:3001
      Cors__AllowedOrigins__1: http://localhost:5174
    ports:
      - "8081:8080"
    volumes:
      - ./data:/data
      - ./backups:/backups

  axis-web:
    image: axis-web:production
    build:
      context: ./src/frontend/axis-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8081
    depends_on:
      - axis-api
    ports:
      - "3001:80"
